<!DOCTYPE html>
<html lang="uk">
<head>

color:#fff;font:12px monospace;padding:8px;max-height:30vh;overflow:auto;z-index:999;display:none;

<body>
<div id="err"></div>

<script type="module">
// Offline harness: exercises every page against synthetic-but-shaped state so
// render crashes surface before the card is ever installed into Home Assistant.
const errBox = document.getElementById('err');
const errs = [];
function report(e) {
  errs.push(e);
  errBox.style.display = 'block';
  errBox.textContent = errs.join('\n\n');
}
window.addEventListener('error', (e) => report(e.message + '\n' + (e.error && e.error.stack || '')));
window.addEventListener('unhandledrejection', (e) => report('rejection: ' + e.reason));
const origWarn = console.error;
console.error = (...a) => { report(a.map(String).join(' ')); origWarn(...a); };

const now = Date.now();
const states = {};
function add(id, state, attrs = {}, agoMs = 60000) {
  const iso = new Date(now - agoMs).toISOString();
  states[id] = {
    entity_id: id, state: String(state), attributes: attrs,
    last_changed: iso, last_updated: iso, last_reported: iso,
  };
}

// --- fast channels
add('sensor.glucose', 5.4, { unit_of_measurement: 'mmol/L' }, 40e3);
add('sensor.glucose_age', 0, { unit_of_measurement: 'min' }, 40e3);
add('sensor.glucose_trend', 'Flat', {}, 40e3);
add('sensor.glucose_mgdl', 97, {}, 40e3);

// --- Withings

// --- environment

qp('cgllc_cgs2_554b', 23.7, 719, 17, 18, 42, 51.4, 46);
const dyson = { pm2_5: 9, pm10: 9, no2: 2, hcho: 0.033, voc: 0.028, indoor_aqi_15_min: 28.5,

for (const [k, v] of Object.entries(dyson)) add(`sensor.dyson_5jb_eu_uka2805a_${k}`, v, {}, 3 * 60e3);

// --- behaviour
add('sensor.walkingpad_current_speed', 0, {}, 12 * 60e3);
add('sensor.walkingpad_state', 'standby', {}, 12 * 60e3);
// --- controls
add('switch.walkingpad_belt', 'off', {}, 12 * 60e3);
add('binary_sensor.walkingpad_connected', 'on', {}, 12 * 60e3);
add('number.walkingpad_speed', 0, { min: 0.5, max: 6, step: 0.1, unit_of_measurement: 'km/h' }, 12 * 60e3);

add('input_button.sleep', 'unknown', {}, 3600e3);

add('input_number.iqos_cigarettes_today', 11, {}, 5 * 3600e3);
add('sensor.c0_69_06_73_9f_d0_iqos_zatiazhki_za_den', 68, {}, 5 * 3600e3);
add('input_datetime.iqos_last_sync_date', '2026-08-05', {}, 5 * 3600e3);
add('input_datetime.foodwatch_last_eaten', '2026-08-05 21:19:02', {}, 3 * 3600e3);
add('input_text.foodwatch_last_meal', '05.08 21:19 · Холодник з креветкою (vecheria) — 238 ккал', {}, 3 * 3600e3);
add('input_number.foodwatch_eaten_calories_total', 3905, {}, 3 * 3600e3);
add('input_number.foodwatch_eaten_carbs_total', 355, {}, 3 * 3600e3);
add('input_number.foodwatch_eaten_protein_total', 193, {}, 3 * 3600e3);
add('input_number.foodwatch_eaten_fat_total', 198, {}, 3 * 3600e3);
add('input_text.foodie_obid', 'Гречка, яловічі болі — 480 ккал, Б 38г, Ж 18г, В 48г', {}, 8 * 3600e3);
add('input_text.foodie_vecheria', 'Крем-суп — 400 ккал, Б 33г, Ж 21г, В 60г', {}, 8 * 3600e3);
add('input_datetime.foodie_data_ratsionu', '2026-08-06', {}, 8 * 3600e3);
add('sensor.iphone_anonymous_steps', 2206, {}, 34 * 60e3);
add('sensor.iphone_anonymous_distance', 1325, {}, 34 * 60e3);
add('sensor.iphone_anonymous_pressure', 14.579, { unit_of_measurement: 'hPa' }, 34 * 60e3);
add('sensor.upright_go_2_posture_angle', 95.8, { unit_of_measurement: '°' }, 9 * 60e3);
add('sensor.nh_health_upright_go_2_slouching_time', 504.18, {}, 9 * 60e3);
add('sensor.nh_health_upright_go_2_upright_time', 749.77, {}, 9 * 60e3);
add('binary_sensor.macbook_nh_camera_in_use', 'off', {}, 60e3);
add('binary_sensor.macbook_nh_active', 'on', {}, 60e3);
add('sensor.macbook_nh_frontmost_app', 'Claude', {}, 60e3);
for (const k of ['water_today', 'sips_today', 'refills_today', 'current_fill_percent', 'last_sip_time']) {
  add(`sensor.h2o00008374_${k}`, 'unknown', {}, 2 * 3600e3);
}
for (const k of ['air', 'artillery', 'chemical', 'nuclear', 'unknown', 'urban_fights']) {
  add(`binary_sensor.zolochivska_teritorialna_gromada_${k}`, k === 'air' ? 'on' : 'off', {}, 30 * 60e3);
}
add('input_number.maksimalnii_puls', 186, {}, 86400e3);

// --- Ornament: 40 synthetic markers across several panels, real attribute shape
const panels = ['Ліпіди', 'Загальний аналіз крові', 'Ферменти крові', 'Вітаміни',
  'Функція щитоподібної залози', 'Загальний аналіз сечі'];
for (let i = 0; i < 40; i++) {
  const panel = panels[i % panels.length];
  const qualitative = i % 7 === 6;
  const refMin = 1, refMax = 10, optMin = 3, optMax = 6;
  const v = 0.5 + (i % 13);
  add(`sensor.ornament_nazariy_marker_${i}`, qualitative ? (i % 3 ? 'Не виявлено' : 'Виявлено') : v, {
    biomarker_id: 100 + i,
    category: panel,
    biomaterial: 'Сироватка',
    status: v > refMax ? 'abnormal' : 'normal',
    is_abnormal: !qualitative && (v > refMax || v < refMin),
    measured_at: i % 3 ? '2025-08-16T00:00:00+00:00' : '2026-08-01T00:00:00+00:00',
    measurement_count: 3,
    reference_min: qualitative ? undefined : refMin,
    reference_max: qualitative ? undefined : refMax,
    optimal_min: qualitative ? undefined : optMin,
    optimal_max: qualitative ? undefined : optMax,
    normal_options: qualitative ? ['Не виявлено'] : undefined,
    previous_value: qualitative ? undefined : v * 0.9,
    trend: 'up',
    unit_of_measurement: qualitative ? undefined : 'ммоль/л',
    synonyms: ['Synthetic marker'],
    history: [
      { date: '2022-01-13T02:00:00+00:00', value: qualitative ? 'Не виявлено' : v * 0.8 },
      { date: '2023-08-25T00:00:00+00:00', value: qualitative ? 'Не виявлено' : v * 0.9 },
      { date: '2025-08-16T00:00:00+00:00', value: qualitative ? 'Не виявлено' : v },
    ],
    friendly_name: `Ornament Nazariy ${panel} Маркер ${i}`,
  }, 3600e3);
}
add('sensor.ornament_nazariy_last_lab_report', '2026-08-01T00:00:00+00:00',
  { results_in_report: 8, reports_total: 15 }, 3600e3);
add('sensor.ornament_nazariy_abnormal_biomarkers', 24, {}, 3600e3);
add('sensor.ornament_nazariy_biomarkers_tracked', 163, {}, 3600e3);
add('sensor.ornament_nazariy_homa_ir', 3.87, {
  category: 'Функція підшлункової залози', biomarker_id: 39, is_abnormal: true,
  reference_min: 0.3, reference_max: 1.9, optimal_min: 0.3, optimal_max: 1,
  measured_at: '2025-08-16T00:00:00+00:00', previous_value: 4.78, trend: 'down',
  measurement_count: 2, friendly_name: 'Ornament Nazariy Функція підшлункової залози HOMA-IR',
  history: [{ date: '2022-01-13T02:00:00+00:00', value: 4.78 }, { date: '2025-08-16T00:00:00+00:00', value: 3.87 }],
}, 3600e3);
for (const [id, v, ref, opt] of [
  ['insulin_fasting', 16.2, [2.6, 24.9], [2.6, 5]],
  ['hemoglobin_a1c', 5.36, [4, 5.6], [4.8, 5.1]],
  ['glucose_fasting', 5.38, [3.9, 5.5], [4.16, 4.72]],
  ['atherogenic_index', 5.71, [0, 5], [0, 3]],
  ['apolipoprotein_b', 1.23, [0, 0.9], [0.52, 0.8]],
  ['ldl_cholesterol', 3.97, [0, 3.3], [0, 2.6]],
  ['triglycerides', 2.88, [0, 1.7], [0, 1.1]],
  ['body_mass_index_averaged', 26.95, [18.5, 30], [20, 25]],
]) {
  add(`sensor.ornament_nazariy_${id}`, v, {
    category: 'Ліпіди', biomarker_id: 1, is_abnormal: v > ref[1],
    reference_min: ref[0], reference_max: ref[1], optimal_min: opt[0], optimal_max: opt[1],
    measured_at: '2025-08-16T00:00:00+00:00', measurement_count: 4, previous_value: v * 0.95, trend: 'up',
    friendly_name: `Ornament Nazariy Ліпіди ${id}`,
    history: [{ date: '2023-08-25T00:00:00+00:00', value: v * 0.95 }, { date: '2025-08-16T00:00:00+00:00', value: v }],
  }, 3600e3);
}

// --- websocket stub: shaped history and statistics
function fakeHistory(msg) {
  const out = {};
  const s = new Date(msg.start_time).getTime(), e = new Date(msg.end_time).getTime();
  for (const id of msg.entity_ids) {
    if (id.includes('h2o') || id.includes('polar')) { out[id] = []; continue; }
    const rows = [];
    // density scales with the window so the 14-day AGP and meal-window paths
    // get realistic point counts, not a token 60
    const isSlow = id.startsWith('binary_sensor') || id.includes('walkingpad_state')
      || id.includes('foodwatch_last_eaten') || id.includes('zatiazhki');
    const n = isSlow ? 40 : Math.min(1600, Math.max(60, Math.round(((e - s) / 3600e3) * 12)));
    for (let i = 0; i < n; i++) {
      const t = s + ((e - s) * i) / (n - 1);
      let v;
      if (id.includes('glucose')) v = 5 + Math.sin(i / 6) * 1.4 + (i % 7) * 0.05;
      else if (id.includes('pm25')) v = 8 + Math.sin(i / 4) * 5 + (i % 5);
      else if (id.includes('co2')) v = 550 + Math.sin(i / 8) * 180;
      else if (id.includes('temperature')) v = 23 + Math.sin(i / 10) * 1.5;
      else if (id.includes('noise')) v = 35 + (i % 9);
      else if (id.includes('heart_rate')) v = 60 + Math.sin(i / 5) * 15;
      else if (id.startsWith('binary_sensor') || id.includes('walkingpad_state')) {
        rows.push({ lu: t / 1000, s: i % 20 < 3 ? 'on' : 'off' });
        continue;
      } else if (id.includes('foodwatch_last_eaten')) {
        rows.push({ lu: t / 1000, s: new Date(t).toISOString().slice(0, 19).replace('T', ' ') });
        continue;
      } else if (id.includes('foodwatch_last_meal')) {
        const dish = ['Mango sticky rice', 'Gnocchi with chicken thigh', 'Buckwheat with beef stew',
          'Omelette with spinach'][i % 4];
        const d = new Date(t);
        rows.push({ lu: t / 1000, s: `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')} `
          + `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} · ${dish} (obid) — `
          + `${380 + (i % 5) * 40} ккал, Б ${20 + i % 9}г, Ж ${14 + i % 7}г, В ${30 + (i % 6) * 6}г` });
        continue;
      } else v = 10 + (i % 11);
      rows.push({ lu: t / 1000, s: String(v.toFixed(2)) });
    }
    out[id] = rows;
  }
  return out;
}
function fakeStats(msg) {
  const out = {};
  const s = new Date(msg.start_time).getTime(), e = new Date(msg.end_time).getTime();
  const days = Math.max(1, Math.round((e - s) / 86400e3));
  for (const id of msg.statistic_ids) {
    const rows = [];
    for (let i = 0; i < days; i++) {
      if (i % 9 === 4) continue; // deliberate gaps, to exercise the hole rendering
      const t = s + i * 86400e3;
      const base = id.includes('fat_ratio') ? 25 - i * 0.02
        : id.includes('muscle') ? 48.5 + i * 0.01
          : id.includes('weight') ? 68 + Math.sin(i / 5) * 0.4
            : id.includes('glucose') ? 5.4 + Math.sin(i / 4) * 0.4
              : id.includes('deep') ? 1.6 + Math.sin(i / 3) * 0.5
                : id.includes('awake') ? 30 + (i % 17)
                  : id.includes('steps') ? 4000 + (i % 13) * 400
                    : id.includes('iqos') ? Math.max(0, 20 - i * 0.2 + (i % 5))
                      : id.includes('trivalist') ? Math.max(0, 0.5 + (i % 7) * 0.2)
                        : 20 + (i % 11);
      rows.push({ start: t, mean: base, min: base * 0.9, max: base * 1.1, state: base, change: 1 });
    }
    out[id] = rows;
  }
  return out;
}

const serviceCalls = [];
const hass = {
  states,
  language: 'uk',
  callWS: async (msg) => {
    if (msg.type === 'history/history_during_period') return fakeHistory(msg);
    if (msg.type === 'recorder/statistics_during_period') return fakeStats(msg);
    return {};
  },
  // record instead of dispatching, so control wiring can be asserted offline
  callService: async (domain, service, data) => {
    serviceCalls.push({ domain, service, data });
    return true;
  },
};
window.__calls = () => serviceCalls;

// `npm run build` writes harness.built.html with the bundle spliced in below,
// so the page under test is always exactly the build that was just produced.
// Open harness.built.html, not this file.
// ---8<--- BUNDLE ---8<---
await import('../dist/health-hub-card.js?v=' + Date.now());
// ---8<--- /BUNDLE ---8<---
const card = document.getElementById('card');
card.setConfig({ type: 'custom:health-hub-card' });
card.hass = hass;

// Walk every page, so one run covers all ten render paths.
const PAGE_IDS = ['now', 'night', 'metab', 'body', 'heart', 'labs', 'env', 'behav', 'corr', 'trust'];
window.__visit = async (id) => {
  card.setState({ page: id });
  await new Promise((r) => setTimeout(r, 700));
  return errs.length;
};
window.__sweep = async () => {
  for (const id of PAGE_IDS) await window.__visit(id);
  return { errors: errs.length, detail: errs.slice(0, 6) };
};
window.__errs = () => errs;
</script>
</body>
</html>
